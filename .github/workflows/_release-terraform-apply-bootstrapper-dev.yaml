name: Release Bootstrapper Infrastructure - dev
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/bootstrapper/dev/**"
      - ".github/workflows/_release-terraform-apply-bootstrapper-dev.yaml"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    uses: pagopa/dx/.github/workflows/release-terraform-bootstrapper-v1.yaml@6abcf9bc0956833202dae18c8218b4a4bc85a7f5 # main
    name: Release Bootstrapper (dev)
    secrets: inherit
    with:
      environment: 'dev'
