name: Terraform apply on dev resources

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infra/resources/dev/**"
      - "infra/resources/_modules/**"
      - ".github/workflows/_release-terraform-apply-dev-resources.yaml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  dev_resources_apply:
    uses: pagopa/dx/.github/workflows/infra_apply.yaml@main
    name: Dev resources - Apply
    secrets: inherit
    with:
      environment: dev
      base_path: infra/resources
      # GitHub-hosted runner: no self-hosted runner is registered for this
      # repository, so a private agent leaves the job queued.
      use_private_agent: false
      # The bootstrap module creates the GitHub environments as infra-<env>-ci/cd.
      override_github_environment: infra-dev
